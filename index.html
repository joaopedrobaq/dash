<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>PBQ</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PBQ" />
    <meta name="theme-color" content="#2c3e50" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body data-view="tarefas">
    <header>
      <h1 onclick="goHome()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();goHome();}" tabindex="0" role="button" aria-label="Ir para a tela inicial" style="cursor:pointer"><img src="icon.svg" alt="" class="header-logo" />PBQ</h1>
    </header>

    <main class="dashboard">
      <section class="card" id="card-esquerda">
        <h2>Ferramentas</h2>
        <nav class="tools-menu">
          <button type="button" class="tool-item" data-tool="prazos">
            <div class="tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg></div>
            <div class="tool-info">
              <div class="tool-name">Contador de Prazos</div>
            </div>
          </button>
          <button type="button" class="tool-item" data-tool="honorarios">
            <div class="tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="3" x2="12" y2="21"/><line x1="5" y1="7" x2="19" y2="7"/><path d="M5 7l-3 6a3 3 0 0 0 6 0z"/><path d="M19 7l-3 6a3 3 0 0 0 6 0z"/><line x1="8" y1="21" x2="16" y2="21"/></svg></div>
            <div class="tool-info">
              <div class="tool-name">Calculadora de Honorários</div>
            </div>
          </button>
          <button type="button" class="tool-item" data-tool="qrcode">
            <div class="tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="3" height="3"/><rect x="18" y="18" width="3" height="3"/></svg></div>
            <div class="tool-info">
              <div class="tool-name">Gerador de QR Code</div>
            </div>
          </button>
          <button type="button" class="tool-item" data-tool="inscricao">
            <div class="tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><line x1="9" y1="20" x2="9" y2="14"/><line x1="15" y1="20" x2="15" y2="14"/></svg></div>
            <div class="tool-info">
              <div class="tool-name">Calculadora de Dígito - IPTU SSA</div>
            </div>
          </button>
        </nav>
      </section>

      <section class="card" id="card-tool">
        <div class="card-tool-header">
          <button class="btn-tool-back" onclick="closeTool()">← <span class="btn-tool-back-label"></span></button>
          <span id="tool-title"></span>
        </div>
        <div id="tool-content"></div>
      </section>

      <section class="card" id="card-todo">
        <h2>Tarefas <span id="sync-status" role="status" aria-live="polite"></span></h2>

        <input id="todo-busca" class="todo-busca" type="search" placeholder="Buscar por cliente, tema ou pasta…" aria-label="Buscar tarefas" autocomplete="off" />

        <div id="todo-erro-banner" class="todo-erro-banner" style="display:none"></div>

        <form id="todo-form" autocomplete="off">
          <div class="todo-inputs">
            <input id="f-cliente" type="text" placeholder="Cliente" />
            <input id="f-tema"    type="text" placeholder="Tema" />
            <input id="f-pasta"   type="text" placeholder="Pasta" />
            <button type="submit">+</button>
          </div>
          <div id="todo-prio-selector"></div>
        </form>

        <table id="todo-table">
          <thead>
            <tr>
              <th></th>
              <th>Cliente</th>
              <th>Tema</th>
              <th>Pasta</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="todo-body"></tbody>
        </table>
      </section>

      <section class="card" id="card-emails">
        <div class="card-header-row">
          <h2>Extrator de E-mails</h2>
          <button id="btn-limpar-emails">Limpar</button>
        </div>
        <textarea id="texto" placeholder="Cole aqui o texto com e-mails..."></textarea>
        <p class="label">E-mails extraídos (exceto @bomfimnovis.com.br):</p>
        <div id="resultado" title="Clique para copiar"></div>
      </section>
    </main>

    <nav class="mobile-nav">
      <button class="nav-tab" data-view="tarefas">
        <span class="nav-icon">✓</span>
        <span class="nav-label">Tarefas</span>
      </button>
      <button class="nav-tab" data-view="emails">
        <span class="nav-icon">@</span>
        <span class="nav-label">E-mails</span>
      </button>
      <button class="nav-tab" data-view="ferramentas">
        <span class="nav-icon">⚙</span>
        <span class="nav-label">Ferramentas</span>
      </button>
    </nav>

    <script src="utils.js"></script>
    <script src="tools/honorarios.js"></script>
    <script src="tools/calendario.js"></script>
    <script src="tools/prazos.js"></script>
    <script src="tools/inscricao.js"></script>
    <script src="tools/qrcode.js"></script>
    <script src="config.js"></script>
    <script src="db.js"></script>
    <script src="emails.js"></script>
    <script src="todo.js"></script>
    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {
            // Falha em registrar não deve quebrar o app — só significa que o
            // modo offline não estará disponível nesta sessão.
          });
        });
      }
    </script>
  </body>
</html>
